[project]
name = "sunledger"
version = "0.1.0"
description = "Independent, consent-based health records for Australian home solar and battery systems (demo reference implementation)"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Han Li" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/HanL1223/sunledger"
Repository = "https://github.com/HanL1223/sunledger"
Documentation = "https://github.com/HanL1223/sunledger/blob/main/docs/PRODUCT_BRIEF.md"

[project.optional-dependencies]
llm = ["anthropic>=2.10.0"]

[project.scripts]
sunledger = "sunledger.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
