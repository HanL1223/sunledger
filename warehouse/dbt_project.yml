name: sunledger
version: "0.1.0"
config-version: 2
profile: sunledger

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
clean-targets: []

flags:
  send_anonymous_usage_stats: false

vars:
  as_of: "2026-11-19"
  reference_pr: 0.80              # performance ratio assumed by the expected-generation model
  min_benchmark_cohort: 5         # k-anonymity floor for any published benchmark
  max_dc_ac_ratio: 1.33           # CEC guideline: array may exceed inverter rating by at most 33%
  min_soc_swing_pct: 40           # deep-cycle days used to estimate usable capacity
  min_handover_soh: 0.95          # first-60-day capacity below this vs quoted usable kWh is an install issue
  synthetic: true                 # pseudonymise brands in benchmarks; neutral platform labels per site

models:
  sunledger:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  sunledger:
    +schema: reference
